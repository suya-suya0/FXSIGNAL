<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FX SIGNAL 更新</title>
<style>
body{margin:0;background:#090f1b;color:#f7f9fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh}
.card{max-width:520px;margin:20px;padding:24px;border:1px solid #293650;background:#111a2a;border-radius:18px}
small{color:#9ba9bd}
</style></head><body>
<div class="card"><h2>FX SIGNALを更新しています</h2><p id="status">古いキャッシュを削除しています…</p><small>Build 2026.10.06-push21</small></div>
<script>
(async()=>{
 try{
  if("serviceWorker" in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   await Promise.all(regs.map(r=>r.unregister()));
  }
  if("caches" in window){
   const keys=await caches.keys();
   await Promise.all(keys.map(k=>caches.delete(k)));
  }
 }catch(e){}
 document.getElementById("status").textContent="更新完了。最新版を開きます…";
 setTimeout(()=>location.replace("./index.html?fresh=2026.10.06-push21&t="+Date.now()),600);
})();
</script></body></html>
